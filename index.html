<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>非遺音樂地理誌 MVP</title>

  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap"
        media="print" onload="this.media='all'">

  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <script src="./vendor/leaflet/leaflet.js"></script>

  <style>
    :root {
      --font-serif: "Noto Serif TC", "PMingLiU", "MingLiU", "新細明體",
                    "標楷體", "DFKai-SB", "BiauKai", "Times New Roman", serif;
      --ink: #ece7dd;
      --ink-dim: #b9b2a5;
      --paper: #1b1b1f;
      --gold: #e8b04b;
    }

    html, body { margin: 0; height: 100%; }

    #map {
      height: 100vh;
      width: 100%;
      background: #101014;
      font-family: var(--font-serif);
    }

    .tile-dark {
      filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.75);
    }

    .brand {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 900;
      max-width: 320px;
      padding: 14px 18px;
      background: rgba(20, 20, 24, 0.93);
      border: 1px solid rgba(232, 176, 75, 0.35);
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .brand h1 {
      margin: 0 0 6px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .brand p {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--ink-dim);
    }

    .popup-content {
      text-align: center;
      font-family: var(--font-serif);
      color: var(--ink);
      font-size: 14px;
    }
    .popup-content h3 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold);
    }
    .popup-content p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--ink-dim);
      text-align: justify;
    }

    .popup-figure { margin: 0 0 12px; }
    .popup-figure img {
      display: block;
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 6px;
      background: #2a2a30;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .popup-figure figcaption {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.6;
      color: #8d8778;
    }

    .popup-content audio {
      width: 100%;
      height: 34px;
      outline: none;
      color-scheme: dark;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }
    .leaflet-popup-content-wrapper { border-radius: 10px; }
    .leaflet-popup-content { margin: 14px 16px; }
    .leaflet-container a.leaflet-popup-close-button { color: var(--ink-dim); }

    .leaflet-control-layers {
      background: rgba(20, 20, 24, 0.9);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-family: var(--font-serif);
      font-size: 13px;
    }
    .leaflet-control-layers-expanded { padding: 10px 14px; }
    .leaflet-control-layers label { margin: 4px 0; }

    .leaflet-control-attribution {
      background: rgba(0, 0, 0, 0.6) !important;
      color: var(--ink-dim);
      font-family: var(--font-serif);
    }
    .leaflet-control-attribution a { color: #9fc4e0; }

    .leaflet-bar a {
      background: #202027;
      color: var(--ink);
      border-bottom-color: rgba(255, 255, 255, 0.15);
    }
    .leaflet-bar a:hover { background: #2c2c35; color: var(--gold); }

    .music-pin {
      box-sizing: border-box;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 3px rgba(232, 176, 75, 0.25), 0 2px 8px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .music-pin:hover { border-color: var(--gold); }

    .music-pin.is-playing { background: #ffd479; }
    .music-pin.is-playing::after {
      content: '';
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      animation: pin-pulse 1.5s ease-out infinite;
    }
    @keyframes pin-pulse {
      0%   { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    @media (max-width: 600px) {
      .brand { max-width: 210px; padding: 10px 12px; }
      .brand h1 { font-size: 15px; }
      .brand p { display: none; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="brand">
    <h1>非遺音樂地理誌</h1>
    <p>點選地圖上的金色標記，聆聽散落各地的非物質文化遺產之聲。</p>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([23.5, 117.5], 6);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const narrow = window.innerWidth < 600;

    const AMAP_ATTR = '&copy; <a href="https://www.amap.com/">高德地圖</a>';
    const AMAP_SUBDOMAINS = ['1', '2', '3', '4'];
    const AMAP_STREET = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';

    const darkLayer = L.tileLayer(AMAP_STREET, {
      subdomains: AMAP_SUBDOMAINS,
      className: 'tile-dark',
      attribution: AMAP_ATTR,
      maxZoom: 18
    }).addTo(map);

    const streetLayer = L.tileLayer(AMAP_STREET, {
      subdomains: AMAP_SUBDOMAINS,
      attribution: AMAP_ATTR,
      maxZoom: 18
    });

    const satelliteLayer = L.layerGroup([
      L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
        subdomains: AMAP_SUBDOMAINS, attribution: AMAP_ATTR, maxZoom: 18
      }),
      L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
        subdomains: AMAP_SUBDOMAINS, maxZoom: 18
      })
    ]);

    L.control.layers(
      { '深色底圖（預設）': darkLayer, '淺色街道圖': streetLayer, '衛星影像': satelliteLayer },
      null,
      { position: 'topright', collapsed: narrow }
    ).addTo(map);

    const musicData = [
      {
        id: "macau-01",
        title: "澳門鹹水歌",
        description: "水上人家的傳統漁歌，反映珠江三角洲的曲調語法。",
        lat: 22.1987,
        lng: 113.5439,
        audioUrl: "./assets/luoyuge.mp3",
        imageUrl: "./assets/img/macau01.jpg",
        imageCaption: "十九世紀澳門港灣與帆船，John Thomson 攝（Public Domain，Wikimedia Commons）"
      },
      {
        id: "taiwan-01",
        title: "台灣客家山歌",
        description: "反映丘陵地形與客家勞動生活的即興歌唱。",
        lat: 24.5815,
        lng: 121.0026,
        audioUrl: "./assets/laushange_hsu.mp3",
        imageUrl: "./assets/img/taiwan01.jpg",
        imageCaption: "臺灣客家戲曲於中元祭演出，Sean Chiu 攝（CC BY-SA 4.0，Wikimedia Commons）"
      },
      {
        id: "chaoshan-01",
        title: "月下煮茶",
        description: "《月下煮茶》是潮语电影主题曲，旋律舒缓温润，借月下煮茶的意象。用方言浅唱，道尽乡愁与对亲人绵长的思念。",
        lat: 23.36,
        lng: 116.67,
        audioUrl: "./assets/yuexiazhucha.mp3",
        imageUrl: "./assets/img/chaoshan01.jpg",
        imageCaption: "潮式工夫茶席，Il lupa 攝（CC BY-SA 4.0，Wikimedia Commons）"
      },
      {
        id: "guangzhou-01",
        title: "彩云追月",
        description: "粤剧版《彩云追月》，在原曲婉转旋律基础上配上粤曲唱词，以柔润的粤剧唱腔描摹云月相随的月夜景致。作品保留岭南音乐的清雅气韵，戏曲韵味浓厚，尽显大湾区传统音乐的诗意之美。",
        lat: 23.13,
        lng: 113.27,
        audioUrl: "./assets/caiyunzhuiyue.mp3",
        imageUrl: "./assets/img/guangzhou01.jpg",
        imageCaption: "廣州青年粵劇團後臺扮相，wingmelee 攝（CC BY-SA 2.5，Wikimedia Commons）"
      },
      {
        id: "sichuan-01",
        title: "太阳出来喜洋洋",
        description: "四川民歌，歌唱山野劳作的欢快情绪，极具巴蜀乡土气息。",
        lat: 29.56,
        lng: 106.58,
        audioUrl: "./assets/taiyangchulaixiyangyang.mp3",
        imageUrl: "./assets/img/sichuan01.jpg",
        imageCaption: "成都平原的林盤與農田，Yuehan wang 攝（CC BY-SA 4.0，Wikimedia Commons）"
      },
      {
        id: "jieyang-01",
        title: "苏六娘",
        description: "潮剧经典剧目，演绎潮汕版梁祝的爱情悲剧，唱腔玩转，地方乡土韵味浓厚。",
        lat: 23.55,
        lng: 116.38,
        audioUrl: "./assets/suliuniang.mp3",
        imageUrl: "./assets/img/jieyang01.jpg",
        imageCaption: "普寧鄉村夜戲現場，Polar1 攝（CC BY 3.0，Wikimedia Commons）"
      },
      {
        id: "quanzhou-01",
        title: "风打梨",
        description: "泉州南音经典曲目，罗列闽南风物起兴，借秋夜月色抒发女子思念情郎的幽怨情思。",
        lat: 24.91,
        lng: 118.59,
        audioUrl: "./assets/fengdali.mp3",
        imageUrl: "./assets/img/quanzhou01.jpg",
        imageCaption: "南音合奏（攝於新加坡天福宮），Jnzl's Photos（Public Domain，Wikimedia Commons）"
      },
    ];

    const USE_WGS84 = true;

    const A = 6378245.0;
    const EE = 0.00669342162296594323;

    function outOfChina(lng, lat) {
      return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
    }

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
      ret += ((20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin((y / 3.0) * Math.PI)) * 2.0) / 3.0;
      ret += ((160.0 * Math.sin((y / 12.0) * Math.PI) + 320.0 * Math.sin((y * Math.PI) / 30.0)) * 2.0) / 3.0;
      return ret;
    }

    function transformLng(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
      ret += ((20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin((x / 3.0) * Math.PI)) * 2.0) / 3.0;
      ret += ((150.0 * Math.sin((x / 12.0) * Math.PI) + 300.0 * Math.sin((x / 30.0) * Math.PI)) * 2.0) / 3.0;
      return ret;
    }

    function wgs84ToGcj02(lng, lat) {
      if (outOfChina(lng, lat)) return [lng, lat];
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = (lat / 180.0) * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - EE * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / (((A * (1 - EE)) / (magic * sqrtMagic)) * Math.PI);
      dLng = (dLng * 180.0) / ((A / sqrtMagic) * Math.cos(radLat) * Math.PI);
      return [lng + dLng, lat + dLat];
    }

    function toMapLatLng(item) {
      const [lng, lat] = USE_WGS84 ? wgs84ToGcj02(item.lng, item.lat) : [item.lng, item.lat];
      return [lat, lng];
    }

    const musicIcon = L.divIcon({
      className: 'music-pin',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -12]
    });

    const markersById = {};

    musicData.forEach(item => {
      const popupHTML = `
        <div class="popup-content">
          <figure class="popup-figure">
            <img src="${item.imageUrl}" alt="${item.title}的樂器或採集現場照片" loading="lazy"
                 onerror="this.closest('.popup-figure').remove()">
            <figcaption>${item.imageCaption}</figcaption>
          </figure>
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          <audio controls controlsList="nodownload" preload="metadata" data-song-id="${item.id}">
            <source src="${item.audioUrl}">
            你的瀏覽器不支援音訊播放。
          </audio>
        </div>
      `;

      const marker = L.marker(toMapLatLng(item), { icon: musicIcon })
        .addTo(map)
        .bindPopup(popupHTML, { maxWidth: 280 });

      markersById[item.id] = marker;
    });

    map.fitBounds(
      L.latLngBounds(musicData.map(toMapLatLng)),
      {
        animate: false,
        paddingTopLeft: narrow ? [20, 120] : [400, 30],
        paddingBottomRight: [40, 40]
      }
    );

    function refreshPlayingPin() {
      const playing = [...document.querySelectorAll('audio')].find(a => !a.paused);
      Object.entries(markersById).forEach(([id, marker]) => {
        const pin = marker.getElement();
        if (pin) pin.classList.toggle('is-playing', !!playing && playing.dataset.songId === id);
      });
    }

    document.addEventListener('play', function (e) {
      const audio = e.target;
      if (!(audio instanceof HTMLAudioElement)) return;

      document.querySelectorAll('audio').forEach(other => {
        if (other !== audio && !other.paused) other.pause();
      });

      refreshPlayingPin();
    }, true);

    document.addEventListener('pause', refreshPlayingPin, true);
    document.addEventListener('ended', refreshPlayingPin, true);

    map.on('popupclose', function (e) {
      const audio = e.popup.getElement()?.querySelector('audio');
      if (audio && !audio.paused) audio.pause();
    });
  </script>
</body>
</html>
